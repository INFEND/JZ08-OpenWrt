name: JZ08 pinned upstream source audit
on:
  push:
    paths:
      - ci/audit_upstream.py
      - ci/build-jz08-development.sh
      - ci/prepare_jz08.py
      - ci/check_built_jz08.py
      - board/msm8916.mk.append
      - board/msm8916-generic-jz08-prototype.dts
      - board/jz08.json
      - .github/workflows/upstream-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect pinned source without executing its scripts
        run: python3 ci/audit_upstream.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-reference-source-hashes
          path: upstream-audit.json
