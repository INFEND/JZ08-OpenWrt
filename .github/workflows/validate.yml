name: JZ08 source checks (no flashing)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check build scripts for Bash syntax errors
        run: bash -n ci/build-jz08-development.sh
      - name: Offline source and GPT identity checks
        run: python3 ci/validate.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Archive non-sensitive checksums
        uses: actions/upload-artifact@v4
        with:
          name: jz08-source-checksums
          path: checksums-source.json
          if-no-files-found: error
