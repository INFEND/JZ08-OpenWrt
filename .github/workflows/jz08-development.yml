name: JZ08 development kernel/OpenWrt build (NOT FLASHABLE)
on:
  push:
    paths:
      - .github/workflows/jz08-development.yml
      - ci/build-jz08-development.sh
      - ci/prepare_jz08.py
      - ci/check_built_jz08.py
      - ci/audit_rootfs_runtime.py
      - ci/disable_unverified_startup.py
      - ci/audit_initramfs_cpio.py
      - ci/locate_initramfs_cpio.py
      - ci/package_jz08_experiment.py
      - board/msm8916-generic-jz08-prototype.dts
      - board/msm8916.mk.append
  workflow_dispatch:
concurrency:
  group: jz08-development-${{ github.ref }}
  # Long kernel/OpenWrt builds must not be discarded by source-audit commits.
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  jz08-development:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Compile JZ08 development profile with GPIO and flashing disabled
        shell: bash
        run: |
          bash ci/build-jz08-development.sh > jz08-development.log 2>&1 || {
            tail -n 200 jz08-development.log
            exit 1
          }
          tail -n 80 jz08-development.log
      - name: Upload logs and text manifests only, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jz08-development-compile-logs-NOT-FLASHABLE
          path: |
            jz08-development.log
            output/*.txt
            output/*.manifest
            output/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload unified verified engineering bundle (NOT FLASHABLE)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JZ08_EXPERIMENTAL_INSPECTION_NOT_FLASHABLE
          path: |
            output/JZ08_EXPERIMENTAL_INSPECTION_NOT_FLASHABLE.zip
            output/JZ08_EXPERIMENTAL_INSPECTION_NOT_FLASHABLE.zip.sha256
            output/JZ08_BUNDLE_VERIFICATION.json
          if-no-files-found: error
          retention-days: 14
